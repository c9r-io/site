name: deploy

# Manual only, behind a reviewed environment: the portal is the first thing
# anyone sees, so no push should be able to change it unattended.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type deploy-c9r.io after reviewing the local build'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.confirmation == 'deploy-c9r.io'
    runs-on: ubuntu-latest
    environment: website-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test and build static site
        run: |
          npm test
          npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=c9r-site --branch=main
